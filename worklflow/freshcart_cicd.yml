name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/client:latest ./client
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/server:latest ./server

      - name: Push Image
        run: |
         docker push ${{ vars.DOCKERHUB_USERNAME }}/client:latest
         docker push ${{ vars.DOCKERHUB_USERNAME }}/server:latest

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e
            cd /home/ubuntu/FreshCart
            docker compose pull

            docker compose up -d

            docker image prune -f

            echo "Running containers:"
            docker ps

            echo "Deployment completed successfully."

      
